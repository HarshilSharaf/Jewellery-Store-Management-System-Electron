services:
  mysql:
    image: mysql:8.0
    container_name: jewellery-store-db
    restart: unless-stopped
    # env_file lets `docker compose` read secrets from `.env` (git-ignored).
    # `.env.example` at the repo root documents the required variable names
    # and safe default values.
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root@123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jewellery}
      MYSQL_USER: ${MYSQL_USER:-zeus_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zeus@123}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - jewellery-db-data:/var/lib/mysql
      - ./docker/init:/docker-entrypoint-initdb.d
      - ./Scripts:/scripts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  jewellery-db-data:
